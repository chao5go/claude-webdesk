name: Bug report / 问题反馈
description: Report a reproducible problem without private data
title: "[Bug] "
body:
  - type: textarea
    id: versions
    attributes:
      label: Environment / 环境
      description: OS, Webdesk, Node, Python and Claude versions. Paste doctor output after removing private paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior / 复现步骤与预期
      description: Use a minimal example. Do not share tokens, private transcripts or credentials.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
