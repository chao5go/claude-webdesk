name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run check && npm run build && npm test && npm run test:python
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:package
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir python-dist
      - run: uv run --no-project --with ./python-dist/claude_webdesk-$(node -p "require('./package.json').version")-py3-none-any.whl python scripts/python-package-smoke.py
      - run: uv run --no-project --with ./python-dist/claude_webdesk-$(node -p "require('./package.json').version").tar.gz python scripts/python-package-smoke.py
      - name: Publish npm
        run: npm publish claude-webdesk-$(node -p "require('./package.json').version").tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish PyPI
        run: uv publish python-dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" claude-webdesk-*.tgz python-dist/* --title "Claude Webdesk $GITHUB_REF_NAME" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
